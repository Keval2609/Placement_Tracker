[project]
name = "placement-tracker-backend"
version = "0.1.0"
description = "Placement Tracker backend (FastAPI + Supabase)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "supabase>=2.5",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "groq>=0.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pywebpush>=1.14.0",
    "apscheduler>=3.10.0",
    "sentry-sdk[fastapi]>=2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
