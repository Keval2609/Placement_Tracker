name: CI & Deployment

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest with >=70% coverage threshold on target modules)
        run: |
          pytest --cov=app.services.llm --cov=app.services.drive_service --cov=app.models.extraction --cov=app.services.alert_service --cov-fail-under=70 --cov-report=term-missing

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Production (Render & Vercel)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deployment
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping Render trigger."
          else
            if curl -sS --retry 3 --retry-delay 5 --retry-all-errors -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"; then
              echo "Render backend deploy hook triggered successfully."
            else
              echo "::warning::Render backend deploy hook request failed. Continuing without failing the workflow."
            fi
          fi

      - name: Trigger Vercel Frontend Deployment
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret not set. Skipping Vercel trigger."
          else
            if curl -sS --retry 3 --retry-delay 5 --retry-all-errors -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"; then
              echo "Vercel frontend deploy hook triggered successfully."
            else
              echo "::warning::Vercel frontend deploy hook request failed. Continuing without failing the workflow."
            fi
          fi
