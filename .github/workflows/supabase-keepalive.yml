name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mondays and Thursdays at 06:00 UTC (well under 7 days apart)
  workflow_dispatch:        # Allow manual execution from GitHub UI

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          raw_url="${{ secrets.SUPABASE_URL }}"
          anon_key="${{ secrets.SUPABASE_ANON_KEY }}"

          supabase_url="$(printf '%s' "$raw_url" | tr -d '[:space:]' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if [ -z "$supabase_url" ]; then
            echo "SUPABASE_URL secret is empty."
            exit 1
          fi

          if [ -z "$anon_key" ]; then
            echo "SUPABASE_ANON_KEY secret is empty."
            exit 1
          fi

          if [[ ! "$supabase_url" =~ ^https?:// ]]; then
            supabase_url="https://$supabase_url"
          fi
          supabase_url="${supabase_url%/}"

          curl_out="$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 15 \
            --max-time 30 \
            -X GET "${supabase_url}/rest/v1/" \
            -H "apikey: $anon_key" 2>&1)" || curl_exit=$?

          status_code="${curl_out: -3}"
          if [[ "${curl_exit:-0}" -ne 0 || "$status_code" == "000" || "$status_code" =~ ^5 ]]; then
            echo "::error::Supabase keepalive ping failed! (HTTP: ${status_code:-000})"
            echo "Diagnostic details:"
            echo "  URL requested: ${supabase_url}/rest/v1/"
            echo "  Curl output/error: ${curl_out}"
            echo ""
            echo "Common causes & troubleshooting:"
            echo "  1. 'Could not resolve host': The project URL '${supabase_url}' is invalid, miscopied, or deleted."
            echo "     Ensure 'SUPABASE_URL' in GitHub Repository Secrets is set to your active project URL (e.g., https://<project-ref>.supabase.co)."
            echo "  2. Project Paused: If the Supabase project was paused due to inactivity, resume it at https://supabase.com/dashboard."
            echo "  3. Invalid Key: Verify 'SUPABASE_ANON_KEY' in GitHub Repository Secrets matches your project's anon key."
            exit 1
          fi

          echo "Supabase keepalive ping successful (HTTP $status_code)."
