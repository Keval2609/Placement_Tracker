name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mondays and Thursdays at 06:00 UTC (well under 7 days apart)
  workflow_dispatch:        # Allow manual execution from GitHub UI

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          raw_url="${{ secrets.SUPABASE_URL }}"
          anon_key="${{ secrets.SUPABASE_ANON_KEY }}"

          supabase_url="$(printf '%s' "$raw_url" | tr -d '[:space:]' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if [ -z "$supabase_url" ]; then
            echo "SUPABASE_URL secret is empty."
            exit 1
          fi

          if [ -z "$anon_key" ]; then
            echo "SUPABASE_ANON_KEY secret is empty."
            exit 1
          fi

          if [[ ! "$supabase_url" =~ ^https?:// ]]; then
            supabase_url="https://$supabase_url"
          fi
          supabase_url="${supabase_url%/}"

          status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 15 \
            --max-time 30 \
            -X GET "${supabase_url}/rest/v1/" \
            -H "apikey: $anon_key")"

          if [[ "$status_code" == "000" || "$status_code" =~ ^5 ]]; then
            echo "Supabase keepalive ping failed with HTTP status: $status_code"
            exit 1
          fi

          echo "Supabase keepalive ping successful (HTTP $status_code)."
