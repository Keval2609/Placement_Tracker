name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 * * 1,3,5"   # Mondays, Wednesdays and Thursdays at 06:00 UTC (well under 7 days apart)
  workflow_dispatch:        # Allow manual execution from GitHub UI

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          supabase_url="$(printf '%s' "$SUPABASE_URL" |
            tr -d '[:space:]' |
            sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

          supabase_anon_key="$(printf '%s' "$SUPABASE_ANON_KEY" |
            tr -d '[:space:]' |
            sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

          if [[ -z "$supabase_url" || -z "$supabase_anon_key" ]]; then
            echo "::error::Supabase secrets are missing."
            exit 1
          fi

          if [[ ! "$supabase_url" =~ ^https://[A-Za-z0-9.-]+\.supabase\.co$ ]]; then
            echo "::error::SUPABASE_URL is not a valid Supabase project URL."
            exit 1
          fi

          response="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$supabase_url/rest/v1/" \
              -H "apikey: $supabase_anon_key" \
              -H "Authorization: Bearer $supabase_anon_key"
          )"

          echo "Supabase keepalive ping successful (HTTP $response)."
