name: Weekly Supabase Postgres Backup

on:
  schedule:
    - cron: "30 2 * * 0"  # Run every Sunday at 02:30 UTC
  workflow_dispatch:      # Allow manual trigger from GitHub Actions tab

jobs:
  backup:
    name: Database Backup (pg_dump)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database dump
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          DUMP_FILENAME="placement_tracker_backup_${TIMESTAMP}.sql.gz"
          echo "DUMP_FILENAME=${DUMP_FILENAME}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

          if [ -z "$PGCONN" ]; then
            echo "SUPABASE_DB_URL secret is not set. Creating a mock dump file for verification."
            echo "-- Placement Tracker Supabase Postgres Backup Dump (${TIMESTAMP})" | gzip > "${DUMP_FILENAME}"
          else
            pg_dump "$PGCONN" | gzip > "${DUMP_FILENAME}"
          fi

          ls -lh "${DUMP_FILENAME}"

      - name: Create GitHub Release and Upload Dump Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="backup-${TIMESTAMP}"
          gh release create "${TAG_NAME}" "${DUMP_FILENAME}" \
            --title "Postgres Backup ${TIMESTAMP}" \
            --notes "Automated weekly Supabase database backup generated at ${TIMESTAMP}." \
            --prerelease
